[tool.poetry]
name = "borgnet"
version = "0.1.0"
description = "Distributed adaptive memetic hive for goal-directed agents."
authors = ["Lehel Kovach"]
readme = "README.md"
packages = [{include = "borgnet"}]

[tool.poetry.dependencies]
python = "^3.10"
networkx = "^3.3"
pydantic = "^2.7"
requests = "^2.31"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["borgnet"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
